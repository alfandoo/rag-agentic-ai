name: stratagent

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env.prod
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      ALLOWED_ORIGINS: https://${APP_DOMAIN}
    expose:
      - "8000"
    volumes:
      - chroma_data:/app/chroma_data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.prod}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
  caddy_data:
  caddy_config:
