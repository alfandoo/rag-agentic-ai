services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stratagent-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://host.docker.internal:3001}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RESEARCH_RATE_LIMIT_PER_HOUR=${RESEARCH_RATE_LIMIT_PER_HOUR:-2}
      - RESEARCH_RATE_LIMIT_PER_DAY=${RESEARCH_RATE_LIMIT_PER_DAY:-20}
      - CHAT_RATE_LIMIT_PER_HOUR=${CHAT_RATE_LIMIT_PER_HOUR:-20}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - chroma_data:/app/chroma_data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: stratagent-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
